<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mucuans</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
<style>
:root{--bg:#fffbe3;--cd:#fff;--tx:#111;--mu:#6b6780;--ln:#d9d2b4;--bk:#111;--in:#16a34a;--ex:#dc2626;--ac:#a855f7;--ya:#e8f55a;--co:#f4685a;--la:#e4c8f7;color-scheme:light}
:root[data-t=dark]{--bg:#16141c;--cd:#232029;--tx:#f5f2ff;--mu:#a9a4bd;--ln:#383344;--bk:#f5f2ff;--in:#5fe0a0;--ex:#ff8a8a;--ac:#c79bff;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:500 14px/1.4 "Plus Jakarta Sans","Poppins","Segoe UI",system-ui,sans-serif}
#app{max-width:480px;margin:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 120px;animation:fi .35s}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
h2{font-size:22px;font-weight:800;margin:6px 0 12px}h3{font-size:19px;font-weight:800;margin:22px 0 10px}a{cursor:pointer}
.cd{background:var(--cd);border:2.5px solid var(--bk);border-radius:22px;padding:16px;box-shadow:3px 3px 0 var(--bk)}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.mu{color:var(--mu);font-size:12px}
.av{width:50px;height:50px;border-radius:50%;background:var(--la);display:grid;place-items:center;font-size:24px;border:2.5px solid var(--bk);box-shadow:2px 2px 0 var(--bk);flex:none;cursor:pointer}
.btn{border:2.5px solid var(--bk);border-radius:99px;padding:11px 20px;font:800 14px inherit;font-family:inherit;background:linear-gradient(90deg,#f9a8d4,#c4b5fd);color:#111;box-shadow:3px 3px 0 var(--bk);cursor:pointer;transition:.15s}
.btn:active{transform:translate(3px,3px);box-shadow:none}.btn.g{background:#fff}.btn.o{background:var(--cd);color:var(--tx)}.btn.r{background:#fecaca;color:#991b1b}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:2.5px solid var(--bk);border-radius:16px;box-shadow:3px 3px 0 var(--bk);padding:10px;color:#111;font-weight:700;font-size:11px}.tile b{display:block;font-size:14px}
.ch{display:inline-block;border:1.5px solid var(--bk);border-radius:99px;padding:2px 10px;font-size:11px;font-weight:700;color:#111;background:#eee}
.in{color:var(--in)}.ex{color:var(--ex)}.tr{margin-bottom:12px}
.seg{display:flex;padding:0;overflow:hidden}.seg button{flex:1;border:0;background:none;padding:14px 6px;font:800 14px inherit;font-family:inherit;color:var(--tx);display:flex;gap:8px;align-items:center;justify-content:center;cursor:pointer}.seg button+button{border-left:2.5px solid var(--bk)}
.ci{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--bk);display:grid;place-items:center;font-size:12px;color:#111}
.ft{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;font-size:10px;font-weight:800}.ft div{cursor:pointer;padding:4px 0}.ft span{display:block;font-size:34px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--cd);border-top:2.5px solid var(--bk);display:flex;justify-content:space-around;align-items:center;max-width:480px;margin:auto;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:none;border:0;color:var(--mu);font:700 10px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;cursor:pointer}nav i{font-style:normal;font-size:22px;filter:grayscale(1);opacity:.6}
nav .on{color:var(--tx);font-weight:800}nav .on i{filter:none;opacity:1}nav .pl{width:52px;height:52px;border-radius:50%;background:var(--bk);color:var(--bg);font-size:30px;padding:0;justify-content:center;margin-top:-6px}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:96px;width:58px;height:58px;border-radius:50%;border:2.5px solid var(--bk);background:#111;color:var(--ya);font-size:32px;box-shadow:3px 3px 0 var(--ya);z-index:4;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}.chip{border-radius:99px;padding:8px 16px;background:var(--cd);color:var(--tx);border:2px solid var(--bk);font:800 13px inherit;font-family:inherit;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--bk);color:var(--bg)}
input,select,textarea{width:100%;padding:12px 14px;border-radius:16px;border:2.5px solid var(--bk);background:var(--cd);color:var(--tx);font:inherit;margin:4px 0 10px;outline:0}
label{font-size:12px;color:var(--tx);font-weight:800;display:block}
#sh{position:fixed;inset:0;z-index:20;display:none}#sh.show{display:block}.bd{position:absolute;inset:0;background:#0007;animation:fi .2s}
.sheet{position:absolute;bottom:0;left:0;right:0;max-width:480px;margin:auto;background:var(--cd);border:2.5px solid var(--bk);border-bottom:0;border-radius:30px 30px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;animation:up .3s}
@keyframes up{from{transform:translateY(60%);opacity:0}}.sheet:before{content:"";display:block;width:44px;height:5px;border-radius:9px;background:var(--ln);margin:0 auto 14px}
.bar{height:12px;border-radius:9px;background:var(--ln);border:2px solid var(--bk);overflow:hidden}.bar i{display:block;height:100%}
.eg{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:10px}.eg span{font-size:22px;text-align:center;padding:4px;border-radius:12px;cursor:pointer}.eg .on{background:var(--ya);color:#111}
.sg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 12px}.sw{aspect-ratio:1;border-radius:14px;border:2px solid var(--bk);cursor:pointer;display:grid;place-items:center;font-size:18px}.sw.on{outline:3px solid var(--ac);outline-offset:1px}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}.ct{border:2px solid var(--bk);border-radius:14px;padding:8px 2px;text-align:center;font-size:10px;font-weight:700;background:var(--cd);cursor:pointer}.ct span{display:block;font-size:22px}.ct.on{background:var(--ya);color:#111}.ct.dash{border-style:dashed}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 20px;border-radius:99px;z-index:30;display:none;max-width:90%;text-align:center;font-size:13px;border:2px solid var(--ya)}
.tabs{display:flex;gap:4px;background:var(--cd);border:2.5px solid var(--bk);border-radius:99px;padding:4px}.tabs button{flex:1;border:0;background:none;padding:9px 2px;border-radius:99px;font:800 12px inherit;font-family:inherit;color:var(--tx);cursor:pointer}.tabs .on{background:var(--bk);color:var(--bg)}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1.5px dashed var(--ln);cursor:pointer}.li:last-child{border:0}.ti{width:42px;height:42px;border-radius:14px;border:2px solid var(--bk);display:grid;place-items:center;font-size:20px;flex:none}
.rh{margin:-14px -16px 16px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 16px;background:var(--co);color:#111;border-bottom:2.5px solid var(--bk)}
</style></head><body><div id="app"></div><nav id="nav"></nav><div id="sh"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),K='mucuans3',uid=()=>Math.random().toString(36).slice(2,9),T=new Date();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>(n<0?'-':'')+'Rp '+Math.abs(Math.round(n)).toLocaleString('id-ID');
const fd=(s,o)=>new Date(s).toLocaleDateString('id-ID',o||{day:'numeric',month:'short',year:'numeric'});
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16);
const PAL=['#ffc9dc','#d9c7ff','#ffe9a8','#c4efd2','#c2e0ff','#ffd8b8'];
const BG=['#ffc928','#8ab8f8','#9bd16d','#f9a8d4','#c4b5fd','#fdba74','#6ee7b7','#fca5a5','linear-gradient(135deg,#ffc9dc,#d9c7ff)','radial-gradient(circle at 20% 20%,#fff9 0 12%,transparent 13%),radial-gradient(circle at 80% 70%,#fff6 0 18%,transparent 19%),#d9f99d','repeating-linear-gradient(45deg,#fff5 0 10px,#fff0 10px 20px),#fde68a','linear-gradient(135deg,#bae6fd,#a5f3fc 50%,#bbf7d0)'];const bgc=w=>w.img?`center/cover url(${w.img})`:BG[w.bg]||BG[0];
const QUOTES=['Uang yang dicatat hari ini adalah ketenangan di hari esok. 🌱','Menabung kecil, konsisten, hasilnya besar. 🐷','Bukan seberapa banyak yang kamu hasilkan, tapi seberapa bijak mengelolanya. ✨','Anggaran bukan membatasi, tapi memberi arah. 🧭','Satu catatan hari ini, satu langkah menuju mimpi. 🚀'];
const EM='🍜☕🛒🎬🧾💊📚🏠🚌⛽🎁💼💰🏦🐷📱💳🎮✈️👕🎓🐶💡🍰🏋️🌴💄🛵🎧📷🧸🍎'.match(/\p{Extended_Pictographic}\uFE0F?/gu);
let S,R='home',F={},Q={q:'',type:'all',cat:'',wal:'',from:'',to:''},P='d';
function seed(){const w=[['Dompet Utama','🏠',0,5000000],['Tabungan','🐷',3,12000000],['E-Wallet','📱',1,750000],['Uang Tunai','💵',2,300000]].map(a=>({id:uid(),name:a[0],icon:a[1],bg:a[2],cur:'IDR',initial:0}));
const ce=[['Makan & Minum','🍜'],['Transportasi','🚌'],['Belanja','🛒'],['Hiburan','🎬'],['Tagihan','🧾'],['Kesehatan','💊'],['Pendidikan','📚'],['Kebutuhan Rumah','🏠']],ci=[['Gaji','💼'],['Bonus','🎁'],['Bisnis','🏪'],['Hadiah','🧸'],['Penghasilan Lain','💰']];
const c=[...ce.map((a,i)=>({id:uid(),type:'expense',name:a[0],emoji:a[1],color:PAL[i%6]})),...ci.map((a,i)=>({id:uid(),type:'income',name:a[0],emoji:a[1],color:PAL[(i+2)%6]}))];
const g=n=>c.find(x=>x.name==n).id,tx=[],add=(d,t,n,a,cn,wi)=>{const x=new Date(T);x.setDate(x.getDate()-d);x.setHours(10,0);tx.push({id:uid(),type:t,name:n,amt:a,cat:g(cn),wallet:w[wi].id,date:iso(x),note:''})};
add(18,'income','Gaji Bulanan',8500000,'Gaji',0);add(0,'expense','Makan siang',45000,'Makan & Minum',2);add(1,'expense','Ojek online',28000,'Transportasi',2);add(2,'expense','Belanja bulanan',420000,'Belanja',0);add(3,'expense','Nonton bioskop',90000,'Hiburan',2);add(4,'expense','Listrik',350000,'Tagihan',0);add(5,'expense','Kopi',32000,'Makan & Minum',3);add(8,'expense','Obat flu',65000,'Kesehatan',3);add(9,'income','Bonus proyek',1200000,'Bonus',0);add(10,'expense','Buku kuliah',210000,'Pendidikan',0);add(12,'expense','Makan malam',120000,'Makan & Minum',0);add(14,'expense','Bensin',60000,'Transportasi',3);add(25,'expense','Belanja online',300000,'Belanja',2);add(40,'expense','Makan',350000,'Makan & Minum',0);add(55,'expense','Tagihan internet',300000,'Tagihan',0);
return{user:{name:'Candra Wiguna',emoji:'🧑'},wallets:w,cats:c,tx:[],budgets:[],_b:[{cat:g('Makan & Minum'),limit:1500000},{cat:g('Hiburan'),limit:400000},{cat:g('Belanja'),limit:1000000}],goals:[],rec:[],dark:matchMedia('(prefers-color-scheme:dark)').matches}}
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S=seed();
const m=T.toISOString().slice(0,7)+'';S.rec.forEach(r=>{const mk=T.getFullYear()+'-'+T.getMonth();if(r.last!=mk&&T.getDate()>=r.day){const d=new Date(T.getFullYear(),T.getMonth(),r.day,8);S.tx.push({...r.t,id:uid(),date:iso(d),name:r.t.name+' (rutin)'});r.last=mk}});save()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Penyimpanan penuh')}}
const W=id=>S.wallets.find(w=>w.id==id)||{name:'?',icon:'❓',bg:0,initial:0},C=id=>S.cats.find(c=>c.id==id)||{name:'Lainnya',emoji:'📦',color:PAL[1]};
function bal(w){let b=+w.initial;S.tx.forEach(t=>{if(t.wallet==w.id){b+=t.type=='income'?t.amt:t.type=='adjust'?t.amt:-t.amt}if(t.type=='transfer'&&t.to==w.id)b+=t.amt});return b}
const total=()=>S.wallets.filter(w=>w.inT!==false).reduce((a,w)=>a+bal(w),0);
const sum=(l,t)=>l.filter(x=>x.type==t).reduce((a,x)=>a+x.amt,0);
const rng=(a,b)=>S.tx.filter(t=>{const d=new Date(t.date);return d>=a&&d<b});
const day0=(o=0)=>new Date(T.getFullYear(),T.getMonth(),T.getDate()+o);
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2500)}
function open(h){$('#sh').innerHTML='<div class="bd" onclick="cl()"></div><div class="sheet">'+h+'</div>';$('#sh').className='show'}
function cl(){$('#sh').className=''}
function go(r){R=r;render();scrollTo(0,0)}
function render(){document.documentElement.dataset.t=S.dark?'dark':'light';
$('#nav').innerHTML=[['home','🏠','Home'],['scan','🧾','Scan Struk'],['+'],['tx','📒','Transaksi'],['rep','📈','Report']].map(a=>a[0]=='+'?`<button class="pl" onclick="quick()">+</button>`:`<button class="${R==a[0]?'on':''}" onclick="go('${a[0]}')"><i>${a[1]}</i>${a[2]}</button>`).join('');
$('#app').innerHTML={home,tx:txPage,rep,scan,set}[R]();$('#app').style.animation='none';$('#app').offsetWidth;$('#app').style.animation='';if(R=='tx')list()}
const row=t=>{const tr=t.type=='transfer',ad=t.type=='adjust',c=tr?{emoji:'🔁',color:'#bfdbfe',name:'Transfer'}:ad?{emoji:'💰',color:'#d9f99d',name:'Penyesuaian'}:C(t.cat),pos=t.type=='income'||(ad&&t.amt>0),tl={income:['Pemasukan','#bbf7d0'],expense:['Pengeluaran','#fecaca'],transfer:['Transfer','#bfdbfe'],adjust:['Penyesuaian','#e9d5ff']}[t.type];
return`<div class="cd tr"><div class="row sp"><div class="row" style="gap:6px;flex-wrap:wrap"><span class="ch" style="background:${c.color}">${c.emoji} ${esc(c.name)}</span><span class="ch" style="background:${tl[1]}">${tl[0]}</span></div><b class="${tr?'':pos?'in':'ex'}" style="font-size:17px">${tr?'':pos?'+':'-'}${rp(Math.abs(t.amt))}</b></div><div style="font-weight:800;font-size:16px;margin:8px 0 6px">${esc(t.name)}</div><div class="row sp"><span class="ch">👛 ${esc(W(t.wallet).name)}${tr?' → '+esc(W(t.to).name):''}</span><span class="mu">${fd(t.date,{day:'numeric',month:'short'})} · ${t.date.slice(11,16)}</span></div><div class="row" style="gap:16px;justify-content:flex-end;margin-top:6px"><a style="color:#2563eb;font-weight:800" onclick="txForm('${t.id}')">Edit</a><a style="color:var(--ex);font-weight:800" onclick="ask('${t.id}')">Hapus</a></div></div>`};
function home(){const w=S.wallets[F.hw||0]||S.wallets[0],last=S.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
const days=[...Array(7)].map((_,i)=>{const a=day0(i-6),b=day0(i-5);return[a,sum(rng(a,b),'expense')]}),tw=days.reduce((a,d)=>a+d[1],0),pw=sum(rng(day0(-13),day0(-6)),'expense'),mx=Math.max(...days.map(d=>d[1]),1),df=pw?Math.round((tw-pw)/pw*100):0;
return`<div style="background:#fef08a;padding:8px 14px;font-size:12px;font-weight:800;border-radius:14px;border:2px solid var(--bk);color:#111">⏰ Mucuans Premium aktif · semua fitur terbuka</div>
<div class="row sp" style="margin:16px 0"><div><h2 style="font-size:28px;line-height:1.1;margin:0 0 4px">Halo, ${esc(S.user.name)}! 👋</h2><div class="mu">Yuk cek uang kamu hari ini</div><div class="mu">${fd(T,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div></div><div class="av" onclick="go('set')">${S.user.emoji}</div></div>
<div class="row sp" style="margin-bottom:10px"><button class="chip" onclick="wallets()">＋ Aset</button><span class="mu">Total aset ${rp(total())}</span><button class="chip" onclick="widgets()">🧩</button></div>
<div class="cd" style="background:${bgc(w)};padding:0;height:200px;position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:linear-gradient(#0000,#0006)"></div><div class="row sp" style="position:absolute;top:12px;left:12px;right:12px"><span class="ch">${w.icon} ${esc(w.name)}</span><span class="ch" onclick="F.hw=((F.hw||0)+1)%S.wallets.length;render()">ganti ⇄</span></div><div style="position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#fff"><div style="font-size:30px;font-weight:800;text-shadow:0 2px 8px #0008">${rp(bal(w))}</div><button class="btn g" style="padding:5px 16px;font-size:12px;margin-top:8px" onclick="wallets()">Lihat Detail ››</button></div></div>
<h3>Yuk Catat!</h3><div class="cd seg"><button onclick="txForm(0,'income')"><span class="ci" style="background:#bbf7d0">↙</span>Pemasukan</button><button onclick="txForm(0,'expense')"><span class="ci" style="background:#fecaca">↗</span>Pengeluaran</button></div>
<div class="cd" style="background:var(--la);margin-top:12px;color:#111;padding:12px 16px" onclick="mot()"><div class="row sp"><div class="row"><span style="font-size:32px">🐻‍❄️</span><b>Kata-kata Mucuans hari ini</b></div><span class="ci" style="background:#fff">✉</span></div><div id="mq" style="display:none;margin-top:8px;font-weight:700"></div></div>
<h3>Features</h3><div class="cd"><div class="ft"><div onclick="go('rep')"><span>💸</span>Cash Performance</div><div onclick="budgets()"><span>🎯</span>Budgeting Challenge</div><div onclick="goals()"><span>🌴</span>Dream Journey</div><div onclick="couple()"><span>💞</span>Couple</div></div></div>
<h3>Pengeluaran Minggu Ini</h3><div class="cd"><div class="row" style="margin-bottom:8px"><span class="ch">${esc(w.name)}</span><span class="mu">Minggu Ini</span></div>${tw?`<div class="row sp"><b style="font-size:22px">${rp(tw)}</b><span class="mu ${df>0?'ex':'in'}">${pw?(df>0?'▲ ':'▼ ')+Math.abs(df)+'% vs minggu lalu':'Belum ada pembanding'}</span></div><div class="row" style="align-items:flex-end;height:90px;margin-top:12px;gap:8px">${days.map(d=>`<div style="flex:1;text-align:center"><div style="height:${Math.max(d[1]/mx*64,4)}px;background:#f9a8d4;border:2px solid var(--bk);border-radius:8px"></div><div class="mu">${d[0].toLocaleDateString('id-ID',{weekday:'narrow'})}</div></div>`).join('')}</div>`:'<div style="text-align:center;padding:18px 0"><div style="font-size:34px">🌱</div><div class="mu">Belum ada pengeluaran minggu ini</div></div>'}</div>
<div class="row sp"><h3>Transaksi Terakhir</h3><a style="color:var(--ac);font-weight:800" onclick="go('tx')">Lihat Semua</a></div>${last.map(row).join('')||'<p class="mu">Belum ada transaksi.</p>'}<button class="fab" onclick="quick()">+</button>`}
function mot(){const e=$('#mq');e.textContent=QUOTES[Math.random()*5|0];e.style.display='block'}
function txPage(){return`<h2 style="font-size:28px">Transaksi</h2><div class="cd"><div class="tabs">${[['all','Semua'],['income','Pemasukan'],['expense','Pengeluaran']].map(a=>`<button class="${Q.type==a[0]?'on':''}" onclick="Q.type='${a[0]}';render()">${a[1]}</button>`).join('')}</div><input id="q" style="margin-top:12px" placeholder="🔍 Cari transaksi..." oninput="Q.q=this.value;list()" value="${esc(Q.q)}">
<label>Filter Waktu (dari – sampai)</label><div class="g2"><input type="date" value="${Q.from}" onchange="Q.from=this.value;list()"><input type="date" value="${Q.to}" onchange="Q.to=this.value;list()"></div>
<label>Filter Kategori</label><select onchange="Q.cat=this.value;list()"><option value="">💰 Semua Kategori</option>${S.cats.map(c=>`<option value="${c.id}" ${Q.cat==c.id?'selected':''}>${c.emoji} ${esc(c.name)}</option>`).join('')}</select>
<label>Dompet</label><select style="margin-bottom:0" onchange="Q.wal=this.value;list()"><option value="">Semua dompet</option>${S.wallets.map(c=>`<option value="${c.id}" ${Q.wal==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div id="list"></div><button class="fab" onclick="txForm()">+</button>`}
function list(){const q=Q.q.toLowerCase(),td=iso(T).slice(0,10);const l=S.tx.filter(t=>(Q.type=='all'||t.type==Q.type)&&(!Q.cat||t.cat==Q.cat)&&(!Q.wal||t.wallet==Q.wal||t.to==Q.wal)&&(!Q.from||t.date.slice(0,10)>=Q.from)&&(!Q.to||t.date.slice(0,10)<=Q.to)&&(!q||(t.name+t.note+C(t.cat).name).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));
const g={};l.forEach(t=>(g[t.date.slice(0,10)]=g[t.date.slice(0,10)]||[]).push(t));

function scan(){return`<h2 style="font-size:28px">📸 Scan Struk</h2><div class="cd"><b>📝 Tips:</b><ul style="margin:8px 0 16px 18px"><li>Pastikan foto jelas dan tidak blur</li><li>Total harga terlihat jelas</li><li>Pencahayaan cukup</li></ul><label class="btn" style="display:block;text-align:center;margin-bottom:12px">📷 Ambil Foto<input type="file" accept="image/*" capture="environment" hidden onchange="scanned(this)"></label><label class="btn g" style="display:block;text-align:center">🖼️ Pilih Gambar<input type="file" accept="image/*" hidden onchange="scanned(this)"></label></div><p class="mu" style="margin-top:12px;text-align:center">Baca otomatis (OCR) belum aktif — foto jadi draft, isi nominal, tanggal & toko lalu simpan.</p>`}
function scanned(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,500/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);txForm(0,'expense',{img:c.toDataURL('image/jpeg',.6),name:'Struk belanja'})};im.src=r.result};r.readAsDataURL(f)}
function set(){return`<a style="font-weight:800" onclick="go('home')">← Kembali</a><h2 style="font-size:28px;margin-top:10px">Pengaturan</h2><div class="cd">${[['👤','Profil pengguna','profile()'],['👛','Edit aset & dompet','wallets()'],['🎯','Budgeting','budgets()'],['🌴','Dream Journey','goals()'],['🧩','Pengaturan Widget','widgets()'],['🌙','Dark mode: '+(S.dark?'aktif':'mati'),'S.dark=!S.dark;save();render()'],['📤','Ekspor laporan (CSV)','exportCsv()'],['💾','Backup & restore data','backup()'],['🗑️','Reset ke data demo','ask2()']].map(a=>`<div class="li" onclick="${a[2]}"><div class="ti" style="background:var(--bg)">${a[0]}</div><b style="flex:1">${a[1]}</b><span class="mu">›</span></div>`).join('')}</div><p class="mu" style="text-align:center;margin-top:16px">Mucuans · data tersimpan di perangkat ini</p>`}
function ask2(){open(`<h2 style="text-align:center">Reset semua data?</h2><p class="mu" style="text-align:center;margin-bottom:14px">Semua data diganti data demo.</p><div class="row"><button class="btn o" style="flex:1" onclick="cl()">Batal</button><button class="btn r" style="flex:1" onclick="localStorage.removeItem(K);load();cl();render()">Reset</button></div>`)}
function profile(){open(`<h2>Profil</h2><label>Nama</label><input id="p-n" value="${esc(S.user.name)}"><label>Avatar (emoji)</label><div class="eg">${EM.slice(0,16).map(e=>`<span class="${S.user.emoji==e?'on':''}" onclick="S.user.name=$('#p-n').value||S.user.name;S.user.emoji='${e}';save();render();profile()">${e}</span>`).join('')}</div><button class="btn" style="width:100%" onclick="S.user.name=$('#p-n').value.trim()||S.user.name;save();cl();render()">Simpan</button>`)}
function exportCsv(){const t='Tanggal,Jenis,Nama,Kategori,Dompet,Nominal,Catatan\n'+S.tx.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date.slice(0,10),t.type,t.name,C(t.cat).name,W(t.wallet).name,t.amt,t.note].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');open(`<h2>Ekspor Laporan</h2><p class="mu">Salin lalu tempel ke Excel / Google Sheets (pilih "Pisahkan dengan koma").</p><textarea id="ex" rows="9">${esc(t)}</textarea><button class="btn" style="width:100%" onclick="$('#ex').select();document.execCommand('copy');toast('Disalin ✓')">Salin CSV</button>`)}
function backup(){open(`<h2>Backup & Restore</h2><p class="mu">Salin teks ini untuk backup. Untuk restore, tempel backup lalu tekan Restore.</p><textarea id="bk" rows="8">${esc(JSON.stringify(S))}</textarea><div class="row"><button class="btn o" style="flex:1" onclick="$('#bk').select();document.execCommand('copy');toast('Disalin ✓')">Salin</button><button class="btn" style="flex:1" onclick="try{const d=JSON.parse($('#bk').value);if(!d.wallets||!d.tx)throw 0;S=d;save();cl();render();toast('Data dipulihkan')}catch(e){toast('Backup tidak valid')}">Restore</button></div>`)}
function quick(){const w=S.wallets[F.hw||0];open(`<div class="cd" style="text-align:center"><b>${w.icon} ${esc(w.name)}</b><div style="font-size:22px;font-weight:800;margin:4px 0 12px">${rp(bal(w))}</div><div class="g2"><button class="btn r" onclick="txForm(0,'expense')">↘ Pengeluaran</button><button class="btn g" style="color:var(--in)" onclick="txForm(0,'income')">↗ Pemasukan</button></div></div><div class="g2" style="margin-top:14px"><button class="btn o" onclick="txForm(0,'transfer')">⇅ Pindah Saldo</button><button class="btn o" onclick="txForm(0,'adjust')">⚖️ Penyesuaian</button><button class="btn o" onclick="wallets()">👛 Edit Aset</button><button class="btn o" onclick="widgets()">✨ Widget</button></div>`)}
function couple(){open(`<h2>Couple Finance 💞</h2><p class="mu" style="margin-bottom:10px">Patungan dengan pasangan: catat hanya bagianmu.</p><label>Total tagihan (Rp)</label><input id="cp-t" type="number"><label>Bagianmu (%)</label><input id="cp-p" type="number" value="50"><label>Untuk apa?</label><input id="cp-n" placeholder="Makan malam bareng"><button class="btn" style="width:100%" onclick="cpSave()">Catat Bagianku</button>`)}
function cpSave(){const t=+$('#cp-t').value,p=+$('#cp-p').value;if(!(t>0)||!(p>0&&p<=100))return toast('Isi total & persen (1-100)');const n=$('#cp-n').value.trim()||'Patungan';txForm(0,'expense',{name:n+' (bagian '+p+'%)',amt:Math.round(t*p/100)})}
let WS={k:'sp',p:'d',s:'sq',w:'',c:'',b:8};
function widgets(){const m0=new Date(T.getFullYear(),T.getMonth(),1),pr={d:[day0(),day0(1)],w:[day0(-6),day0(1)],m:[m0,day0(1)]}[WS.p],sp=rng(...pr).filter(t=>t.type=='expense'&&(!WS.w||t.wallet==WS.w)&&(!WS.c||t.cat==WS.c)).reduce((a,t)=>a+t.amt,0),lim=S.budgets.reduce((a,b)=>a+b.limit,0),used=rng(m0,day0(1)).filter(t=>t.type=='expense'&&S.budgets.some(b=>b.cat==t.cat)).reduce((a,t)=>a+t.amt,0),sv=S.goals.reduce((a,g)=>a+g.saved,0),PN={d:'Hari ini',w:'Minggu ini',m:'Bulan ini'};
const [lab,val]={sp:['Pengeluaran '+PN[WS.p],sp],bu:['Sisa budget bulan ini',lim-used],sv:['Total tabungan',sv]}[WS.k],rad={sq:'26px',ci:'50%',cl:'50% 45% 55% 50%/55% 50% 50% 45%'}[WS.s];
open(`<h2>🧩 Pengaturan Widget</h2><div class="tabs">${[['sp','💰 Pengeluaran'],['bu','🎯 Budgeting'],['sv','🐷 Tabungan']].map(a=>`<button class="${WS.k==a[0]?'on':''}" onclick="WS.k='${a[0]}';widgets()">${a[1]}</button>`).join('')}</div><div style="display:grid;place-items:center;margin:14px 0"><div style="width:160px;height:160px;border:2.5px solid var(--bk);box-shadow:3px 3px 0 var(--bk);border-radius:${rad};background:${BG[WS.b]};display:grid;place-items:center;text-align:center;color:#111;padding:14px"><div><div class="mu" style="color:#111">${lab}</div><b style="font-size:18px">${rp(val)}</b></div></div></div>
${WS.k=='sp'?`<label>Periode</label><div class="tabs" style="margin-bottom:10px">${Object.entries(PN).map(a=>`<button class="${WS.p==a[0]?'on':''}" onclick="WS.p='${a[0]}';widgets()">${a[1]}</button>`).join('')}</div><label>Kategori</label><select onchange="WS.c=this.value;widgets()"><option value="">Semua</option>${S.cats.filter(c=>c.type=='expense').map(c=>`<option value="${c.id}" ${WS.c==c.id?'selected':''}>${c.emoji} ${esc(c.name)}</option>`).join('')}</select><label>Dompet</label><select onchange="WS.w=this.value;widgets()"><option value="">Semua</option>${S.wallets.map(c=>`<option value="${c.id}" ${WS.w==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`:''}
<label>Bentuk</label><div class="tabs" style="margin-bottom:10px">${[['sq','▢ Square'],['ci','● Circle'],['cl','☁ Cloud']].map(a=>`<button class="${WS.s==a[0]?'on':''}" onclick="WS.s='${a[0]}';widgets()">${a[1]}</button>`).join('')}</div><label>Background</label><div class="sg">${BG.slice(0,10).map((b,i)=>`<div class="sw ${WS.b==i?'on':''}" style="background:${b}" onclick="WS.b=${i};widgets()"></div>`).join('')}</div><button class="btn" style="width:100%" onclick="toast('Tersimpan ✓ Di HP: tekan lama homescreen → Widgets → Mucuans')">➕ Tambahkan Widget di homescreen</button>`)}
load();render();
</script></body></html>
